<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ description or 'Michael’s Investment Club — student-led finance, investing education, and market insights.' }}" />
  <title>{{ title or "Michael's Investment Club" }}</title>
  <style>
    :root{
      --navy:#0b1830;
      --blue:#2563eb;
      --blue2:#4f7cff;
      --ink:#172033;
      --muted:#667085;
      --line:#e6eaf0;
      --bg:#f6f8fc;
      --card:#ffffff;
      --soft:#eef4ff;
      --gold:#d5a63a;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:var(--bg);
      line-height:1.65;
    }
    a{color:inherit}
    .container{width:min(1120px,92%);margin:0 auto}
    header{
      color:white;
      background:
        radial-gradient(circle at 85% 20%, rgba(79,124,255,.42), transparent 27%),
        linear-gradient(135deg,#08152b 0%,#102b58 52%,#245eea 100%);
      padding-bottom:92px;
    }
    nav{
      display:flex;justify-content:space-between;align-items:center;
      gap:24px;padding:22px 0;flex-wrap:wrap
    }
    .brand{font-weight:800;letter-spacing:.2px}
    .links{display:flex;gap:20px;flex-wrap:wrap}
    .links a{color:white;text-decoration:none;font-size:.95rem;opacity:.93}
    .hero{
      display:grid;grid-template-columns:1.25fr .75fr;gap:48px;
      align-items:center;padding-top:58px
    }
    .eyebrow{
      text-transform:uppercase;letter-spacing:1.5px;font-size:.78rem;font-weight:800;
      color:#9fb9ff
    }
    h1{font-size:clamp(2.7rem,6vw,5.3rem);line-height:.98;margin:12px 0 22px}
    .hero p{font-size:1.14rem;color:#d9e5ff;max-width:720px}
    .actions{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
    .btn{
      display:inline-block;padding:12px 18px;border-radius:11px;text-decoration:none;font-weight:800
    }
    .btn.primary{background:white;color:#1748c7}
    .btn.ghost{border:1px solid rgba(255,255,255,.5);color:white}
    .hero-card{
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
      backdrop-filter:blur(10px);border-radius:24px;padding:28px
    }
    .hero-card .metric{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.15)}
    .hero-card .metric:last-child{border-bottom:0}
    .metric strong{display:block;font-size:1.4rem}
    main{margin-top:-42px;padding-bottom:70px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px;
      box-shadow:0 10px 28px rgba(16,24,40,.055)
    }
    .card h3{margin:5px 0 9px}
    section{padding-top:64px}
    h2{font-size:2.15rem;margin:0 0 12px;line-height:1.15}
    .lead{color:var(--muted);max-width:800px}
    .bio{
      display:grid;grid-template-columns:.82fr 1.18fr;gap:28px;align-items:stretch
    }
    .portrait{
      min-height:360px;border-radius:22px;
      background:
        linear-gradient(160deg,rgba(11,24,48,.1),rgba(37,99,235,.18)),
        url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1200&q=80') center/cover;
      border:1px solid var(--line)
    }
    .bio-copy{display:flex;flex-direction:column;justify-content:center}
    .bio-copy p{color:var(--muted)}
    .socials{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}
    .social{
      text-decoration:none;border:1px solid var(--line);background:white;
      padding:10px 14px;border-radius:10px;font-weight:750
    }
    .social.placeholder{opacity:.58}
    .timeline{display:grid;gap:14px;margin-top:20px}
    .item{
      padding:18px 20px;background:white;border:1px solid var(--line);border-radius:14px
    }
    .item strong{display:block}
    .topics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .topic{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}
    .topic b{display:block;margin-bottom:4px}
    .sim{
      display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center
    }
    .statbox{
      background:linear-gradient(145deg,#0b1830,#153b78);color:white;border-radius:20px;padding:30px
    }
    .statbox .big{font-size:2.9rem;font-weight:850;margin:4px 0}
    .callout{
      background:var(--soft);border:1px solid #dbe7ff;border-radius:16px;padding:22px
    }
    .footer-grid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:.92rem}
    @media(max-width:850px){
      .hero,.bio,.sim,.grid3,.topics{grid-template-columns:1fr}
      .hero{padding-top:35px}
      header{padding-bottom:70px}
      .portrait{min-height:300px}
    }
  
    .post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
    .post-card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;text-decoration:none;display:block}
    .post-card:hover{transform:translateY(-2px);transition:.18s ease;box-shadow:0 12px 30px rgba(16,24,40,.08)}
    .post-meta{font-size:.86rem;color:var(--muted);margin-bottom:8px}
    .post-card h3{margin:4px 0 8px}
    .post-page{max-width:800px;margin:0 auto}
    .post-page img{max-width:100%;border-radius:16px}
    .post-body{font-size:1.07rem}
    .post-body h2,.post-body h3{margin-top:1.7em}
    .post-body p{margin:1em 0}
    @media(max-width:850px){.post-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header style="padding-bottom:40px">
  <div class="container">
    <nav>
      <div class="brand"><a href="/" style="color:white;text-decoration:none">MICHAEL'S INVESTMENT CLUB</a></div>
      <div class="links">
        <a href="/#about">About</a>
        <a href="/#michael">About Me</a>
        <a href="/#activities">Activities</a>
        <a href="/insights/">Market Insights</a>
        <a href="/#join">Join</a>
      </div>
    </nav>
  </div>
</header>

<main style="margin-top:0">
  {{ content | safe }}
</main>

<footer>
  <div class="container footer-grid">
    <div>© 2026 Michael's Investment Club</div>
    <div>Student-led financial education • michaelinvestmentclub.com</div>
  </div>
</footer>
</body>
</html>
